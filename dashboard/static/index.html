<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkle Dashboard</title>
<style>
:root { --bg: #0d1117; --surface: #161b22; --surface2: #21262d; --surface3: #30363d;
  --border: #30363d; --text: #e6edf3; --muted: #8b949e; --green: #3fb950; --red: #f85149;
  --yellow: #d29922; --blue: #58a6ff; --purple: #bc8cff; --cyan: #39d2c0; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5; display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar { width: 280px; min-width: 280px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 1.1rem; font-weight: 700; }
.sidebar-header p { font-size: 0.75rem; color: var(--muted); }
.run-list { flex: 1; overflow-y: auto; padding: 8px; }
.run-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.15s; }
.run-item:hover { background: var(--surface2); }
.run-item.active { background: var(--surface2); border: 1px solid var(--border); }
.run-item .run-name { font-size: 0.8rem; font-weight: 600; font-family: monospace; color: var(--blue); }
.run-item .run-meta { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
.run-item .run-stats { display: flex; gap: 8px; margin-top: 4px; font-size: 0.7rem; }
.run-item .stat { display: flex; align-items: center; gap: 3px; }
.run-item .stat .dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.green { background: var(--green); }
.dot.red { background: var(--red); }
.dot.purple { background: var(--purple); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: space-between; }
.main-header h2 { font-size: 1rem; }
.main-header .actions { display: flex; gap: 8px; }
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); font-size: 0.78rem; cursor: pointer; transition: background 0.15s; }
.btn:hover { background: var(--surface3); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { opacity: 0.9; }
.main-content { flex: 1; overflow-y: auto; padding: 24px; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.card-value { font-size: 1.6rem; font-weight: 700; }
.card-value small { font-size: 0.9rem; color: var(--muted); font-weight: 400; }
.card-label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
.card-bar { height: 4px; background: var(--surface2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.card-bar .bar { height: 100%; border-radius: 2px; transition: width 0.3s; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tab { padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; color: var(--muted);
  background: transparent; border: none; transition: all 0.15s; }
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active { color: var(--text); background: var(--surface2); font-weight: 600; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Table */
.section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.section-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex;
  align-items: center; justify-content: space-between; }
.section-header h3 { font-size: 0.9rem; }
.filter-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; width: 200px; }
.filter-input::placeholder { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
th { text-align: left; padding: 8px 12px; background: var(--surface2); color: var(--muted);
  font-weight: 600; text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.05em;
  cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: var(--text); }
td { padding: 6px 12px; border-bottom: 1px solid var(--border); }
tr:hover { background: rgba(88,166,255,0.04); }
tr.clickable { cursor: pointer; }
.pid { font-family: monospace; font-weight: 600; color: var(--blue); }
.num { text-align: right; font-family: monospace; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.68rem; font-weight: 600; }
.badge.ok { background: rgba(63,185,80,0.15); color: var(--green); }
.badge.fail { background: rgba(248,81,73,0.15); color: var(--red); }
.badge.warn { background: rgba(210,153,34,0.15); color: var(--yellow); }
.badge.na { background: var(--surface2); color: var(--muted); }

/* PPA Chart */
.ppa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.ppa-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.ppa-card h3 { font-size: 0.85rem; margin-bottom: 12px; }
.ppa-bars { display: flex; flex-direction: column; gap: 4px; }
.ppa-row { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; }
.ppa-row .label { width: 100px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; color: var(--muted); font-family: monospace; }
.ppa-row .bar-wrap { flex: 1; height: 16px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.ppa-row .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.ppa-row .val { width: 60px; text-align: right; font-family: monospace; }

/* Detail panel */
.detail-panel { position: fixed; right: 0; top: 0; width: 500px; height: 100vh; background: var(--surface);
  border-left: 1px solid var(--border); transform: translateX(100%); transition: transform 0.2s;
  display: flex; flex-direction: column; z-index: 100; }
.detail-panel.open { transform: translateX(0); }
.detail-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex;
  align-items: center; justify-content: space-between; }
.detail-header h3 { font-size: 0.95rem; }
.close-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; padding: 4px 8px; }
.close-btn:hover { color: var(--text); }
.detail-body { flex: 1; overflow-y: auto; padding: 16px; }
pre.code { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px;
  font-size: 0.75rem; overflow-x: auto; white-space: pre; font-family: 'SF Mono', Consolas, monospace; }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--muted); }
.empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.3; }
.empty p { font-size: 0.85rem; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
</style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <h1>Sparkle Dashboard</h1>
    <p>Agent Run Results &amp; PPA</p>
  </div>
  <div class="run-list" id="run-list"></div>
</div>

<!-- Main -->
<div class="main">
  <div class="main-header" id="main-header">
    <h2 id="run-title">Select a run</h2>
    <div class="actions">
      <button class="btn" onclick="refreshRuns()">Refresh</button>
      <button class="btn primary" id="btn-report" style="display:none" onclick="openReport()">Open Report</button>
    </div>
  </div>
  <div class="main-content" id="main-content">
    <div class="empty"><div class="empty-icon">&#9881;</div><p>Select a run from the sidebar</p></div>
  </div>
</div>

<!-- Detail Panel -->
<div class="detail-panel" id="detail-panel">
  <div class="detail-header">
    <h3 id="detail-title">Problem Detail</h3>
    <button class="close-btn" onclick="closeDetail()">&times;</button>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
